name: USM v2 — Build & Deploy (staging)

on:
  push:
    branches: [usm-v2]
    paths:
      - "usm-v2/**"
      - ".github/workflows/usm-v2-staging.yml"
  workflow_dispatch: {}
  # Déclenché par le bouton « Publier » de l'admin (repository_dispatch)
  repository_dispatch:
    types: [usm-v2-publish]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usm-v2
    # Secret service-account requis pour : lecture Firestore au build (Jalon 2)
    # ET déploiement Hosting. Tant qu'il est absent, le build tourne mais le
    # déploiement est sauté (pas d'échec dur).
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_USM != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: usm-v2/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Lu par lib/firebase-build.ts (Admin SDK) pour pré-générer les pages.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_USM }}
        run: npm run build

      - name: Deploy to staging
        if: env.HAS_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_USM }}
          projectId: usm-football-b56ba
          target: staging
          channelId: live
          entryPoint: usm-v2
